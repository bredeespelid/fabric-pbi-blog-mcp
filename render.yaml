services:
  - type: web
    name: fabric-pbi-blog-mcp
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: CACHE_TTL_SECONDS
        value: "900"
